[workspace]
members = ["slint-template/", "lib/*"]
exclude = []
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2024"
version = "0.1.0"
keywords = ["Rust"]
readme = "README.md"
authors = ["Heng30 <rongheng30@gmail.com>"]
homepage = "https://github.com/Heng30/slint-template"
repository = "https://github.com/Heng30/slint-template"
description = "It's a Rust Slint GUI framework project for quick start."

[profile.dev]
debug = 1

[profile.dev-rel]
debug = 2
inherits = "release"

[profile.release]
debug = 0
lto = true
strip = true
opt-level = "z"
panic = "abort"
codegen-units = 1

[workspace.dependencies]
uuid = "1"
serde = "1"
bytes = "1"
tokio = "1"
log = "0.4"
hex = "0.4"
aes = "0.8"
cfg-if = "1"
anyhow = "1"
sqlx = "0.8"
rand = "0.9"
toml = "0.8"
duct = "0.13"
chrono = "0.4"
slint = "1.11"
image = "0.25"
qrcode = "0.14"
once_cell = "1"
reqwest = "0.12"
webbrowser = "1"
derivative = "2"
serde_with = "3"
serde_json = "1"
console_log = "1"
getrandom = "0.3"
clipboard = "0.5"
block-modes = "0.9"
crypto-hash = "0.3"
env_logger = "0.11"
wasm-bindgen = "0.2"
display-info = "0.5"
embed-resource = "3"
platform-dirs = "0.3"
android_logger = "0.15"
terminal-clipboard = "0.4"
cutil = { path = "lib/cutil" }
sqldb = { path = "lib/sqldb" }
