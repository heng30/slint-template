[workspace]
exclude = []
resolver = "2"
members = ["slint-template/", "lib/*"]

[workspace.package]
license = "MIT"
edition = "2024"
version = "0.1.0"
readme = "README.md"
# rust-version = "1.87"
authors = ["Heng30 <rongheng30@gmail.com>"]
keywords = ["Rust", "GUI", "Slint", "cross-platform"]
homepage = "https://github.com/Heng30/slint-template"
repository = "https://github.com/Heng30/slint-template"
description = "It's a Rust Slint GUI framework project for quick start."

[profile.dev]
debug = "full"
incremental = true

[profile.release]
lto = true
debug = true
strip = true
panic = "abort"
opt-level = "s"
codegen-units = 1
incremental = true

[workspace.dependencies]
log = "0.4"
hex = "0.4"
aes = "0.8"
sqlx = "0.8"
rand = "0.9"
toml = "0.8"
duct = "1.0"
uuid = "1.16"
serde = "1.0"
bytes = "1.10"
tokio = "1.44"
slint = "1.11"
image = "0.25"
anyhow = "1.0"
chrono = "0.4"
qrcode = "0.14"
reqwest = "0.12"
getrandom = "0.3"
clipboard = "0.5"
once_cell = "1.21"
serde_json = "1.0"
webbrowser = "1.0"
derivative = "2.2"
serde_with = "3.12"
env_logger = "0.11"
console_log = "1.0"
block-modes = "0.9"
crypto-hash = "0.3"
wasm-bindgen = "0.2"
display-info = "0.5"
platform-dirs = "0.3"
embed-resource = "3.0"
android_logger = "0.15"
terminal-clipboard = "0.4"
cutil = { path = "lib/cutil" }
sqldb = { path = "lib/sqldb" }
