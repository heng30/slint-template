[workspace]
members = ["slint-template/", "lib/*"]
exclude = []
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2024"
version = "0.1.0"
keywords = ["Rust"]
readme = "README.md"
authors = ["Heng30 <rongheng30@gmail.com>"]
homepage = "https://github.com/Heng30/slint-template"
repository = "https://github.com/Heng30/slint-template"
description = "It's a Rust Slint GUI framework project for quick start."

[profile.dev]
debug = 1

[profile.dev-rel]
debug = 2
inherits = "release"

[profile.release]
debug = 0
lto = true
strip = true
opt-level = "z"
panic = "abort"
codegen-units = 1

[workspace.dependencies]
log = "0.4"
hex = "0.4"
aes = "0.8"
sqlx = "0.8"
uuid = "1.9"
rand = "0.9"
toml = "0.8"
bytes = "1.0"
duct = "0.13"
serde = "1.0"
chrono = "0.4"
slint = "1.11"
tokio = "1.38"
cfg-if = "1.0"
anyhow = "1.0"
image = "0.25"
qrcode = "0.14"
cmd_lib = "1.9"
reqwest = "0.12"
getrandom = "0.2"
clipboard = "0.5"
once_cell = "1.19"
webbrowser = "1.0"
derivative = "2.2"
serde_with = "3.8"
serde_json = "1.0"
block-modes = "0.9"
crypto-hash = "0.3"
console_log = "1.0"
env_logger = "0.11"
slint-build = "1.11"
wasm-bindgen = "0.2"
display-info = "0.5"
platform-dirs = "0.3"
embed-resource = "3.0"
android_logger = "0.15"
terminal-clipboard = "0.4"
sqldb = { version = "0.1", path = "lib/sqldb" }
cutil = { version = "0.1", path = "lib/cutil" }
